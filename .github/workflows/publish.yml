name: Publish verified Android APK
on:
  push:
    branches: [publish/v0.9-diagnostic]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary transfer key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl req -new -x509 -key "$RUNNER_TEMP/private.pem" -subj /CN=release-transfer -days 1 -out public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-public-key
          path: public.pem
          retention-days: 1
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for i in $(seq 1 80); do
            if git fetch --quiet origin refs/heads/publish/transfer-v09; then break; fi
            sleep 6
          done
          git show FETCH_HEAD:transfer.enc > "$RUNNER_TEMP/transfer.enc"
          openssl cms -decrypt -binary -inform DER -in "$RUNNER_TEMP/transfer.enc" -inkey "$RUNNER_TEMP/private.pem" -out "$RUNNER_TEMP/location"
          url=$(cat "$RUNNER_TEMP/location")
          curl --fail --silent --show-error --location --proto '=https' "$url" -o "$RUNNER_TEMP/build.zip"
          cd "$RUNNER_TEMP"
          echo '3c806e4d49cddb29d69e8a0ad50904ebac108007363f57ef13e5df13d372c08f  build.zip' | sha256sum -c -
          unzip -q build.zip Minion_Catalog_v0.9_diagnostic.apk
          echo 'ccf4280d34c166e54fcf7cb80c7b93195f7c3b1ed421b2df1d5787f276050556  Minion_Catalog_v0.9_diagnostic.apk' > SHA256.txt
          sha256sum -c SHA256.txt
          gh release create v0.9-diagnostic Minion_Catalog_v0.9_diagnostic.apk SHA256.txt --repo "$GITHUB_REPOSITORY" --target main --title 'Minion Catalog 0.9 — диагностическая версия для Android' --notes 'Обновлены горизонтальная камера и оформление каталога. Добавлены поиск по нескольким выбранным бутылочкам и отдельный крупный план этикетки. Перед переустановкой сохраните резервную копию коллекции.'
